# مخطّط نشر بوصلتي على Render
# https://render.com/docs/blueprint-spec
#
# ينشئ خدمتين: تطبيق Next.js وقاعدة PostgreSQL مربوطة به تلقائياً.
# البناء يطبّق الترحيلات ثم يهيّئ بيانات المقياس، وكلاهما آمن عند التكرار.

databases:
  - name: bawsalati-db
    databaseName: bawsalati
    user: bawsalati
    plan: free
    region: frankfurt

services:
  - type: web
    name: bawsalati
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /api/health
    # خطوات البيانات في scripts/prepare-deploy.ts: إن تعذّر الوصول إلى القاعدة
    # حذّر وأكمل البناء، فلا يتجمّد النشر كلّه بسبب قاعدة بعيدة.
    buildCommand: >-
      npm ci &&
      npm run deploy:data &&
      npm run build
    startCommand: npm run start

    # ملاحظة التخزين:
    # ملفات المكتبة ودليل الطالب تُكتب على القرص. قرص خدمات الخطة المجانية
    # مؤقّت، فتختفي الملفات المرفوعة عند كل نشر جديد. ولذلك يُعاد في كل بناء
    # إدخال الدليل وكتب content/library — وهي في المستودع فتعود كما كانت.
    # أمّا ما يرفعه الأخصائي من لوحته فلا مصدر له في المستودع: يضيع ملفه،
    # ويحذف library:prune سجلّه بعد الاستيراد كي لا تبقى صفحةٌ لا تفتح.
    # عند الترقية إلى خطة مدفوعة أزل التعليق عن الكتلة التالية واضبط
    # STORAGE_DIR على /var/data، فيثبت كل مرفوع ولا يحذف prune شيئاً.
    # disk:
    #   name: bawsalati-storage
    #   mountPath: /var/data
    #   sizeGB: 5

    envVars:
      - key: NODE_VERSION
        value: "22"

      # يُربط تلقائياً بقاعدة البيانات أعلاه
      - key: DATABASE_URL
        fromDatabase:
          name: bawsalati-db
          property: connectionString

      # مفتاح توقيع الجلسات — تولّده Render ولا يظهر في المستودع
      - key: JWT_SECRET
        generateValue: true

      # كلمة مرور الحسابين الأوّلين (مدير + مختص).
      # تطلبها Render منك عند إنشاء المخطّط، ولا تُقرأ من المستودع.
      # تُستخدم عند إنشاء الحساب فقط، ولا تُعيد ضبط كلمة مرور حساب قائم.
      - key: SEED_PASSWORD
        sync: false

      - key: STORAGE_DIR
        value: ./storage

      # موازن حِمل واحد أمام الخدمة، فيُقرأ عنوان العميل من آخر مدخل
      # في X-Forwarded-For بدل أول مدخل يتحكّم به المتصل.
      - key: TRUSTED_PROXY_HOPS
        value: "1"

      # مزوّد الإشعارات عبر واتساب. callmebot أسرع طريق لتنبيه رقم الإدارة:
      # يكفي أن يضاف مفتاح الرقم في CALLMEBOT_KEYS من لوحة Render.
      # للواتساب الرسمي من Meta: whatsapp-cloud مع WHATSAPP_TOKEN و
      # WHATSAPP_PHONE_NUMBER_ID. بلا مفاتيح لا يُرسل شيء ويبقى الحجز سليماً.
      - key: NOTIFY_PROVIDER
        value: callmebot
      # يستلم تفاصيل كل حجز مؤكَّد كاملةً (إدارة المدرسة).
      - key: BOOKING_ALERT_PHONE
        value: "96894996269"
      # «الرقم:المفتاح» مفصولة بفواصل، مثل 96894996269:1234567
      - key: CALLMEBOT_KEYS
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      # اسم قالب معتمد في Meta، لإرسال الرسالة خارج نافذة الـ24 ساعة
      - key: WHATSAPP_TEMPLATE
        sync: false
      - key: NOTIFY_API_URL
        sync: false
      - key: NOTIFY_API_TOKEN
        sync: false
      - key: NOTIFY_SENDER_ID
        sync: false

      # بريد إشعار الحجز — قناة مستقلّة تعمل مع الواتساب لا بدلاً منه.
      # لجيميل: smtp.gmail.com والمنفذ 465، وSMTP_PASS كلمة مرور تطبيقات
      # (من إعدادات أمان الحساب) لا كلمة مرور الحساب نفسها.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # اسم المُرسِل وعنوانه كما يظهران للمستلم
      - key: MAIL_FROM
        sync: false
      # نسخة إدارة المدرسة من كل حجز
      - key: BOOKING_ALERT_EMAIL
        sync: false
